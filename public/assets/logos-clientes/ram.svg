<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" fill="#111111"/>
  <!-- Ram head silhouette -->
  <!-- Left horn - spiral/curl -->
  <path d="M30 42 C20 38 14 28 18 20 C22 12 32 12 36 18 C40 24 36 32 30 32" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Right horn - spiral/curl -->
  <path d="M70 42 C80 38 86 28 82 20 C78 12 68 12 64 18 C60 24 64 32 70 32" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Face -->
  <ellipse cx="50" cy="50" rx="16" ry="18" stroke="white" stroke-width="3" fill="none"/>
  <!-- Eyes -->
  <circle cx="44" cy="46" r="2.5" fill="white"/>
  <circle cx="56" cy="46" r="2.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="56" rx="5" ry="3.5" stroke="white" stroke-width="2" fill="none"/>
  <circle cx="47.5" cy="55.5" r="1.2" fill="white"/>
  <circle cx="52.5" cy="55.5" r="1.2" fill="white"/>
  <!-- Horns connecting to head -->
  <path d="M34 32 C34 36 36 40 38 42" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M66 32 C66 36 64 40 62 42" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <path d="M36 46 C28 44 26 52 34 52" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M64 46 C72 44 74 52 66 52" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
